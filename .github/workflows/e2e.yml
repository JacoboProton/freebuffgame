name: e2e

# Runs the Playwright e2e suite against a real Postgres in a service
# container. Triggered on PRs, pushes to main, and manual dispatch
# (useful for verifying the badge gets a status without waiting for
# a PR/push).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright e2e (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before starting the job.
        # Without a health check the job can race the container and fail
        # with ECONNREFUSED on the first request.
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL is injected as a job-level env var (auto-masked in
      # logs). Prefers the DATABASE_URL repo secret if set — useful for
      # pointing at a managed Postgres (Supabase, Neon, Render, etc.).
      # Falls back to the service container above for local-equivalent
      # runs and for PRs from forks (where secrets aren't available).
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Push Prisma schema
        working-directory: apps/api
        # The version log makes any version-mismatch or schema/extension
        # issue diagnosable from the Actions UI. The 3-retry loop absorbs
        # the most likely transient flake (service container Postgres
        # still initializing when pg_isready passes). The `exit 0` inside
        # the loop and `exit 1` after ensure the step fails if all
        # retries fail (a trailing `sleep 5` would otherwise mask it).
        # The leading `git config` commands work around an unrelated repo
        # issue: the `saucectl-testcafe-example` submodule is in an
        # inconsistent state (untracked content), which makes Prisma's
        # `git rev-parse` fail with exit 128. `safe.directory '*'`
        # whitelists the mounted repo, and `GIT_TERMINAL_PROMPT=0`
        # prevents any interactive prompts from hanging the step.
        run: |
          git config --global --add safe.directory '*'
          export GIT_TERMINAL_PROMPT=0
          npx prisma --version
          for i in 1 2 3; do
            npx prisma db push --skip-generate && exit 0
            echo "::warning::prisma db push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Run Playwright e2e tests
        id: playwright
        working-directory: apps/api
        # Equivalent to `cd apps/api && npx playwright test`. The webServer
        # in playwright.config.ts will spin up the test server, run all
        # specs in apps/api/e2e/, and tear the server down on exit.
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          # test-results/ has per-test traces, screenshots, and videos for
          # failed specs. playwright-report/ has the self-contained HTML
          # report (with embedded traces) that can be opened locally via
          # `npx playwright show-report` after downloading the artifact.
          # Block scalar preserves the newline so upload-artifact sees two
          # separate paths, not one string with embedded newlines.
          path: |
            apps/api/test-results/
            apps/api/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
