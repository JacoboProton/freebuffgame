name: e2e

# Runs the Playwright e2e suite against a real Postgres in a service
# container. Triggered on PRs, pushes to main, and manual dispatch
# (useful for verifying the badge gets a status without waiting for
# a PR/push).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright e2e (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before starting the job.
        # Without a health check the job can race the container and fail
        # with ECONNREFUSED on the first request.
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL is injected as a job-level env var (auto-masked in
      # logs). Prefers the DATABASE_URL repo secret if set — useful for
      # pointing at a managed Postgres (Supabase, Neon, Render, etc.).
      # Falls back to the service container above for local-equivalent
      # runs and for PRs from forks (where secrets aren't available).
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Push Prisma schema
        working-directory: apps/api
        # Diagnostic block — four prior fix attempts (b2fcb79, 3552b2e,
        # 4667bd8, 85618cb) failed with the generic
        # `git failed with exit code 128` and the actual failing git
        # invocation was hidden. The probes below log the repo's git
        # state (so we can see ownership, identity, and any submodule
        # shenanigans), and `set -x` traces the prisma invocation.
        # Together they turn "exit 128" into an actionable diagnosis.
        # Remove the entire block once the prisma step is green.
        run: |
          set -x
          git --version
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git rev-parse --abbrev-ref HEAD
          git config --get user.email
          git config --get user.name
          git status --short || true
          git submodule status || true
          npx prisma db push --skip-generate 2>&1 | tee /tmp/prisma.log

      - name: Run Playwright e2e tests
        id: playwright
        working-directory: apps/api
        # Equivalent to `cd apps/api && npx playwright test`. The webServer
        # in playwright.config.ts will spin up the test server, run all
        # specs in apps/api/e2e/, and tear the server down on exit.
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          # test-results/ has per-test traces, screenshots, and videos for
          # failed specs. playwright-report/ has the self-contained HTML
          # report (with embedded traces) that can be opened locally via
          # `npx playwright show-report` after downloading the artifact.
          # Block scalar preserves the newline so upload-artifact sees two
          # separate paths, not one string with embedded newlines.
          path: |
            apps/api/test-results/
            apps/api/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
