# Render Web Service - Express API Backend
# https://render.com/docs/deploy-node-express

services:
  - type: web
    name: freebuffgame-api
    env: node
    region: oregon
    plan: free
    # rootDir removed - we work from repo root to resolve workspace packages
    buildCommand: curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL="$HOME/.bun" && PATH="$BUN_INSTALL/bin:$PATH" && cd apps/api && bun install && bunx prisma generate && bunx prisma db push --skip-generate
    startCommand: cd apps/api && npx tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        # Comma-separated list of allowed origins
        value: https://freebuffgame-web.onrender.com,https://rxktk3y4.insforge.site
      - key: API_URL
        value: https://freebuffgame-api.onrender.com
      - key: FRONTEND_URL
        value: https://freebuffgame-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk server secret for backend usage only.
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false